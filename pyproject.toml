[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-sweep-manager"
version = "0.2.0"
description = "Automated hyperparameter sweeps on HPC systems using Hydra configs and W&B tracking"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Gabriel Bena", email = "gabriel.bena@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
keywords = ["hpc", "hyperparameter", "sweep", "hydra", "wandb", "machine-learning"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
    "rich>=12.0.0",
    "psutil>=5.9.0",
    "asyncssh>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    # ruff is exact-pinned: it is the style SSOT, so CI, pre-commit and the editor name the same version.
    "ruff==0.15.13",
    # pyright is exact-pinned like ruff: the type gate, the same locally and in CI.
    "pyright==1.1.414",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/GabrielBena/HPC-Sweep-Manager"
Documentation = "https://github.com/GabrielBena/HPC-Sweep-Manager/tree/main/docs"
Repository = "https://github.com/GabrielBena/HPC-Sweep-Manager"
Changelog = "https://github.com/GabrielBena/HPC-Sweep-Manager/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/GabrielBena/HPC-Sweep-Manager/issues"

[project.scripts]
hsm = "hpc_sweep_manager.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpc_sweep_manager = ["templates/*.j2"]

[tool.ruff]
# The program's style SSOT (loom's pyproject), so editor, pre-commit and CI agree.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["N803", "N806", "E741"]

[tool.ruff.lint.per-file-ignores]
# Due for deletion in the 2026-10 pass (docs/dev/maintenance-2026-10.md): the dead-code chore
# (chore-6). Drop this line with the file.
"src/hpc_sweep_manager/cli/configure.py" = ["F841", "E722"]

[tool.pyright]
# The type gate (loom's standard mode) over the library; tests are checked by running them.
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=hpc_sweep_manager",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=0",
]
