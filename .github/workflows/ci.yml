name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled: the chunk cap reads the PR's labels (oversize-approved), as in loom.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A new push to a pull request cancels the run it supersedes; on main every push runs to the end,
# so every commit that lands keeps its full verification.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    # Fast, apart from the tests: the same hooks as pre-commit (ruff, ruff-format), so the editor,
    # a local commit and CI never disagree; then the chunk cap (CONTRIBUTING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pre-commit && pre-commit run --all-files --show-diff-on-failure
      - name: chunk size (hand-written lines; tests and prose excluded; cap 150)
        if: github.event_name == 'pull_request' && !contains(join(github.event.pull_request.labels.*.name, ','), 'oversize-approved')
        run: scripts/chunk_size.sh "origin/${{ github.base_ref }}" 150

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor (pyproject requires-python) + the version we run day-to-day.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        # Hermetic — PATH-stub fakes for sbatch/squeue/sacct/nvidia-smi + a
        # fake asyncssh conn, so no real cluster/SSH is needed. pytest.ini
        # supplies coverage flags (non-gating).
        run: pytest tests/unit tests/cli tests/integration
